function simpleBars(rs,list,type){
 if(!list.length)return `<div class="exec-empty">Sin datos.</div>`;
 const vals=list.map(([k,u])=>{const s=stats(rs.filter(r=>r.executive===k),k);return {name:u.name,v:type==='sale'?s.sale:s.accepted}});
 const max=Math.max(1,...vals.map(x=>x.v));
 return `<div class="chart">${vals.map((x,i)=>`<div style="animation-delay:${i*70}ms"><div class="barwrap"><div class="bar" style="height:${Math.max(3,x.v/max*100)}%;background:${type==='sale'?'linear-gradient(180deg,#ffd166,#ff7b00)':'linear-gradient(180deg,#b967ff,#6c4cff)'}"><span>${type==='sale'?money(x.v):x.v}</span></div></div><div class="barlabel">${esc(x.name)}</div></div>`).join('')}</div><div class="mini" style="margin-top:8px">${type==='sale'?'Ventas ganadas en el período filtrado.':'Asignaciones aceptadas por el ejecutivo en el período filtrado.'}</div>`;

function statusChart(rs){const total=Math.max(1,rs.length);return `<div class="reason-chart">${stages.map(s=>{const n=rs.filter(r=>r.status===s).length,p=n/total*100;return `<div class="reason-item"><span class="reason-label">${s}</span><div class="reason-track"><div class="reason-fill" style="width:${p}%"></div></div><span class="reason-pct">${p.toFixed(1)}%</span></div>`}).join("")}<div class="mini" style="color:#bcd0e3;margin-top:12px">Base: ${rs.length} oportunidades del período filtrado.</div></div>`}
function lineChart(rs){const won=rs.filter(r=>r.status==="Ganado"),vals=lineNames.map(line=>({line,value:won.filter(r=>r.line===line).reduce((a,r)=>a+Number(r.saleValue||r.value||0),0)})),total=vals.reduce((a,x)=>a+x.value,0),max=Math.max(1,...vals.map(x=>x.value));return `<div class="chart">${vals.map((x,i)=>{const p=total?x.value/total:0;return `<div style="animation-delay:${i*80}ms"><div class="barwrap"><div class="bar" style="height:${Math.max(3,x.value/max*100)}%;background:linear-gradient(180deg,#ff4ecd,#7c3aed)"><span>${pct(p)}<small class="chart-value">${money(x.value)}</small></span></div></div><div class="barlabel">${esc(x.line)}</div></div>`}).join("")}</div><div class="mini" style="margin-top:10px">Total ganado: ${money(total)} · ${won.length} oportunidades Ganadas.</div>`}
function offerChart(rs){const won=rs.filter(r=>r.status==="Ganado"),vals=offerItems.map(item=>({item,n:won.filter(r=>Array.isArray(r.offers)&&r.offers.includes(item)).length})),total=won.length,max=Math.max(1,...vals.map(x=>x.n));return `<div class="chart">${vals.map((x,i)=>{const p=total?x.n/total:0;return `<div style="animation-delay:${i*55}ms"><div class="barwrap"><div class="bar" style="height:${Math.max(3,x.n/max*100)}%;background:linear-gradient(180deg,#00f2fe,#4facfe)"><span>${pct(p)}</span></div></div><div class="barlabel">${esc(x.item)}</div></div>`}).join("")}</div><div class="mini" style="margin-top:10px">Base: ${total} oportunidades Ganadas. Un registro puede incluir varios productos.</div>`}

 e.preventDefault();const f=new FormData(e.target),id=k||f.get("username").trim().toLowerCase(),pin=String(f.get("pass")||"").trim();if(!id||users[id]&&!k){toast("Ese usuario ya existe");return}if(!/^\d{4}$/.test(pin)){toast("El PIN debe tener exactamente 4 números");return}users[id]={pass:pin,name:f.get("name"),role:f.get("role"),key:id};targets[id]={total:Number(f.get("total")||0),parts:Number(f.get("parts")||0),pub:Number(f.get("pub")||0),management:Number(f.get("mgmt")||40)};delete deletedUsers[id];save();closeModal();toast("Usuario guardado");render();

function removeUser(k){if(k==="admin"){toast("El administrador principal no se puede eliminar");return}if(!confirm("¿Quitar este usuario? Los registros históricos se conservarán y el usuario no volverá a aparecer al recargar."))return;deletedUsers[k]={name:users[k]?.name||k,removedAt:new Date().toISOString(),removedBy:current.login,removedByUid:firebaseUid||null};delete users[k];delete targets[k];if(current.login===k){logout();return}save();toast("Usuario retirado definitivamente");render()}
function renderBSC(){
 setTop("Balanced Scorecard","Indicadores estratégicos expresados en porcentaje");
 const rs=visibleRecords(),won=rs.filter(r=>r.status==="Ganado"),lost=rs.filter(r=>r.status==="Perdido");
 const totalTarget=allExecs().filter(([k])=>current.login==="admin"||current.login==="gerente"?true:k===current.key).reduce((a,[k])=>a+(targets[k]?.total||0),0);
 const sales=won.reduce((a,r)=>a+Number(r.saleValue||r.value||0),0);
 const metrics=[
  ["Financiero — cumplimiento de meta",totalTarget?sales/totalTarget:0],
  ["Comercial — conversión a Ganado",(won.length+lost.length)?won.length/(won.length+lost.length):0],
  ["Proceso — asignaciones aceptadas",rs.length?rs.filter(r=>r.acceptedDate).length/rs.length:0],
  ["Gestión — oportunidades con seguimiento",rs.length?rs.filter(r=>Number(r.management||0)>0||r.notes).length/rs.length:0]
 ];
 const reasons={};lossReasons.forEach(x=>reasons[x]=0);lost.forEach(r=>reasons[r.lossReason||"Otra"]=(reasons[r.lossReason||"Otra"]||0)+1);
 const totalLost=lost.length;
 document.getElementById("content").innerHTML=`<div class="score">${card("Oportunidades perdidas",totalLost,"Período filtrado")}${card("Tasa de pérdida",pct(rs.length?totalLost/rs.length:0),"Perdidos / registros")}${card("Valor perdido",money(lost.reduce((a,r)=>a+Number(r.quotedValue||r.value||0),0)),"Cotizado asociado")}${card("Oportunidades ganadas",won.length,"Conversión comercial")}</div>
 <div class="grid" style="margin-top:18px"><div class="panel"><h2>📈 Balanced Scorecard — cumplimiento (%)</h2><div class="bsc-chart">${metrics.map(([n,v])=>`<div class="bsc-row"><span class="bsc-name">${n}</span><div class="bsc-track"><div class="bsc-fill" style="width:${Math.min(v*100,100)}%"></div></div><span class="bsc-value">${pct(v)}</span></div>`).join("")}</div><div class="mini" style="margin-top:10px">Los porcentajes se calculan con los registros y metas disponibles en el período seleccionado.</div></div>
 <div class="panel"><h2>⚠️ Objeciones / causas de pérdida (%)</h2><div class="reason-chart">${Object.entries(reasons).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(([r,n])=>{const p=totalLost?n/totalLost*100:0;return `<div class="reason-item"><span class="reason-label">${esc(r)}</span><div class="reason-track"><div class="reason-fill" style="width:${p}%"></div></div><span class="reason-pct">${p.toFixed(1)}%</span></div>`}).join("")||'<div class="empty" style="color:#fff">Aún no existen pérdidas tipificadas.</div>'}</div></div></div>
 <div class="panel" style="margin-top:18px"><h2>Detalle de oportunidades perdidas</h2><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Ejecutivo</th><th>Línea</th><th>Valor</th><th>Razón</th><th>Fecha</th></tr></thead><tbody>${lost.map(r=>`<tr onclick="showRecord('${r.id}')" style="cursor:pointer"><td>${esc(r.client)}</td><td>${esc(users[r.executive]?.name||r.executive)}</td><td>${r.line}</td><td>${money(r.quotedValue||r.value)}</td><td><span class="badge red">${esc(r.lossReason||"Otra")}</span></td><td>${fmtDate(r.assignedDate)}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">No hay oportunidades perdidas.</td></tr>'}</tbody></table></div></div>`;
}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
try{save()}catch(e){}
</script>
<script>
// Firebase bootstrap: inicia la nube y restaura la sesión local sin pedir PIN al recargar.
document.addEventListener("DOMContentLoaded",()=>{
  try{
    initCloud();
    const sess=readJSON("crmSessionV2",null);
    if(sess?.login&&users[sess.login]){
      current={login:sess.login,...users[sess.login],firebaseUid:firebaseUid};
      document.getElementById("login")?.classList.add("hidden");
      document.getElementById("app")?.classList.remove("hidden");
      render();
    }
  }catch(e){console.error("CRM bootstrap",e);setOnlineIndicator();}
});
</script>
